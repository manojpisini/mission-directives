<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 286" role="img" aria-labelledby="title desc">
  <title id="title">Mission Directives routing flow</title>
  <desc id="desc">A transparent four-stage route, explain, plan, and verify workflow diagram for dark backgrounds.</desc>
  <style>
    .heading,.stage{fill:#ffffff}.copy,.detail{fill:#d8dfd7}.index{fill:#b9d0ad}.node{fill:#17211c;fill-opacity:.6;stroke:#7f9a72}.rule{stroke:#53624e}.accent{stroke:#9fba92;fill:#9fba92}
  </style>
  <text class="heading" x="42" y="42" font-family="Inter,-apple-system,Segoe UI,sans-serif" font-size="25" font-weight="750">Smallest coherent execution graph</text>
  <text class="copy" x="42" y="70" font-family="Inter,-apple-system,Segoe UI,sans-serif" font-size="14">Resolve metadata first. Load only the bodies required for a verified outcome.</text>
  <path class="rule" d="M42 92H958" fill="none"/>
  <g font-family="Cascadia Code,SFMono-Regular,Menlo,Consolas,monospace">
    <g transform="translate(42 118)">
      <rect class="node" width="152" height="104" rx="8"/>
      <text class="index" x="18" y="29" font-size="12" font-weight="700">01</text>
      <text class="stage" x="18" y="58" font-size="20" font-weight="800">ROUTE</text>
      <text class="detail" x="18" y="82" font-size="12">intent + IDs</text>
    </g>
    <g transform="translate(296 118)">
      <rect class="node" width="152" height="104" rx="8"/>
      <text class="index" x="18" y="29" font-size="12" font-weight="700">02</text>
      <text class="stage" x="18" y="58" font-size="20" font-weight="800">EXPLAIN</text>
      <text class="detail" x="18" y="82" font-size="12">mode + risk</text>
    </g>
    <g transform="translate(550 118)">
      <rect class="node" width="152" height="104" rx="8"/>
      <text class="index" x="18" y="29" font-size="12" font-weight="700">03</text>
      <text class="stage" x="18" y="58" font-size="20" font-weight="800">PLAN</text>
      <text class="detail" x="18" y="82" font-size="12">bounded graph</text>
    </g>
    <g transform="translate(804 118)">
      <rect class="node" width="152" height="104" rx="8"/>
      <text class="index" x="18" y="29" font-size="12" font-weight="700">04</text>
      <text class="stage" x="18" y="58" font-size="20" font-weight="800">VERIFY</text>
      <text class="detail" x="18" y="82" font-size="12">evidence</text>
    </g>
  </g>
  <g class="accent" stroke-width="3" stroke-linecap="square">
    <path d="M214 170H274"/><path d="M274 170l-10-7v14z" stroke="none"/>
    <path d="M468 170H528"/><path d="M528 170l-10-7v14z" stroke="none"/>
    <path d="M722 170H782"/><path d="M782 170l-10-7v14z" stroke="none"/>
  </g>
  <path class="rule" d="M42 248H958" fill="none"/>
  <text class="copy" x="42" y="273" font-family="Inter,-apple-system,Segoe UI,sans-serif" font-size="12">Authority remains explicit: audit, plan, draft, apply-safe, apply-approved, or verify-only.</text>
</svg>
