name: Publish Mission Directives

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: '3.12'
          activate-environment: 'true'
      - run: uv pip install -r requirements-dev.txt
      - run: python tools/audit_prompt_bodies.py
      - run: python tools/run_tests.py
      - run: python tools/run_evaluations.py
      - run: python tools/validate_suite.py
      - run: uv build
      - run: python tools/package_smoke.py dist
      - uses: actions/upload-artifact@v6
        with:
          name: python-distributions
          path: dist/*
          if-no-files-found: error

  publish-pypi:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: python-distributions
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist

  publish-github:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: python-distributions
          path: dist
      - run: sha256sum dist/* > dist/SHA256SUMS
      - env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_DESCRIPTION: |
            Mission Directives provides deterministic prompt routing, pinned project runtimes, schema-validated project context, and verifiable agent workflows.

            Install with uv, pipx, or pip, or run it directly with uvx. See the documentation for initialization, routing, configuration, and the local output viewer.
        run: |
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            existing_assets="$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')"
            for asset in dist/*; do
              name="$(basename "$asset")"
              if ! printf '%s\n' "$existing_assets" | grep -Fxq "$name"; then
                gh release upload "$RELEASE_TAG" "$asset" --repo "$GITHUB_REPOSITORY"
              fi
            done
          else
            gh release create "$RELEASE_TAG" dist/* \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --title "Mission Directives ${RELEASE_TAG#v}" \
              --notes "$RELEASE_DESCRIPTION" \
              --generate-notes
          fi
