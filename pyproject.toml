[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "mission-directives"
dynamic = ["version"]
description = "Deterministic prompt routing, project context, and verifiable agent workflows."
readme = "PYPI_README.md"
requires-python = ">=3.11"
license = "MIT OR Apache-2.0"
license-files = ["LICENSE-MIT", "LICENSE-APACHE"]
authors = [{ name = "Manoj Pisini" }]
keywords = ["agents", "prompts", "orchestration", "automation", "cli"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dependencies = [
  "jsonschema>=4.20,<5",
  "markdown-it-py>=3,<5",
  "PyYAML>=6.0,<7",
  "uvicorn>=0.30,<1",
]

[project.urls]
Homepage = "https://manojpisini.github.io/mission-directives/index.html"
Documentation = "https://manojpisini.github.io/mission-directives/docs.html"
Repository = "https://github.com/manojpisini/mission-directives"
Issues = "https://github.com/manojpisini/mission-directives/issues"

[project.scripts]
mission-directives = "mission_directives.cli:main"

[tool.hatch.version]
path = "src/mission_directives/__about__.py"

[tool.hatch.build]
artifacts = [
  "src/mission_directives/_runtime",
]

[tool.hatch.build.targets.wheel]
packages = ["src/mission_directives"]

[tool.hatch.build.targets.sdist]
include = [
  "/src",
  "/assets",
  "/compatibility",
  "/config",
  "/docs",
  "/examples",
  "/integrations",
  "/policies",
  "/prompts",
  "/schemas",
  "/templates",
  "/tools",
  "/catalog.json",
  "/SCENARIO_CATALOG.json",
  "/PROMPT_EXECUTION_ORDER.md",
  "/skill_registry.json",
  "/requirements-runtime.txt",
  "/VERSION",
  "/RELEASE_ID",
  "/LICENSE",
  "/LICENSE-MIT",
  "/LICENSE-APACHE",
  "/README.md",
  "/PYPI_README.md",
  "/config/runtime_payload.json",
]

[tool.hatch.build.hooks.custom]
path = "hatch_build.py"

[tool.pytest.ini_options]
testpaths = ["tests"]
