<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" viewBox="0 0 1200 540">
  <title id="title">Runtime payload boundary</title>
  <desc id="desc">A split diagram showing lean installed runtime files separated from repository-only validation, tests, CI, evaluations, and site sources.</desc>
  <defs><style>.bg{fill:#f8faf9}.box{fill:#fff;stroke:#d4dcd8;stroke-width:2}.keep{fill:#d7eee4;stroke:#146f49;stroke-width:2}.repo{fill:#fff1ec;stroke:#b84f37;stroke-width:2}.ink{fill:#0d1411}.muted{fill:#59645f}.accent{fill:#146f49}.warn{fill:#b84f37}.label{font:740 29px system-ui,sans-serif}.small{font:540 20px system-ui,sans-serif}</style></defs>
  <rect class="bg" width="1200" height="540"/>
  <text x="60" y="62" class="label ink">Install less, operate fully</text>
  <text x="60" y="96" class="small muted">The project install carries runtime contracts. Tests, evaluations, import tooling, CI, and site source stay upstream.</text>
  <g transform="translate(60 145)"><rect class="box" width="500" height="310" rx="4"/><text x="28" y="48" class="label accent">Installed runtime</text><rect class="keep" x="28" y="82" width="210" height="54" rx="4"/><text x="48" y="116" class="small ink">prompts</text><rect class="keep" x="262" y="82" width="210" height="54" rx="4"/><text x="282" y="116" class="small ink">catalogs</text><rect class="keep" x="28" y="158" width="210" height="54" rx="4"/><text x="48" y="192" class="small ink">schemas</text><rect class="keep" x="262" y="158" width="210" height="54" rx="4"/><text x="282" y="192" class="small ink">policies</text><rect class="keep" x="28" y="234" width="444" height="54" rx="4"/><text x="48" y="268" class="small ink">md.py, router, installer helpers</text></g>
  <g transform="translate(640 145)"><rect class="box" width="500" height="310" rx="4"/><text x="28" y="48" class="label warn">Repository only</text><rect class="repo" x="28" y="82" width="210" height="54" rx="4"/><text x="48" y="116" class="small ink">tests</text><rect class="repo" x="262" y="82" width="210" height="54" rx="4"/><text x="282" y="116" class="small ink">evaluations</text><rect class="repo" x="28" y="158" width="210" height="54" rx="4"/><text x="48" y="192" class="small ink">CI</text><rect class="repo" x="262" y="158" width="210" height="54" rx="4"/><text x="282" y="192" class="small ink">docs site</text><rect class="repo" x="28" y="234" width="444" height="54" rx="4"/><text x="48" y="268" class="small ink">import, audit, validation tooling</text></g>
</svg>