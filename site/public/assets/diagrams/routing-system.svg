<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" viewBox="0 0 1200 520">
  <title id="title">Mission Directives routing system</title>
  <desc id="desc">A left to right flow showing query analysis, deterministic scoring, selected prompt graph, execution, and verification evidence.</desc>
  <defs>
    <style>.bg{fill:#f7f9f8}.panel{fill:#fff;stroke:#cbd2ce;stroke-width:2}.ink{fill:#111513}.muted{fill:#58625c}.accent{fill:#18794e}.warn{fill:#d85d3f}.line{fill:none;stroke:#18794e;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}.soft{fill:#dff3e8}.small{font:500 22px system-ui,sans-serif}.label{font:720 30px system-ui,sans-serif}.tiny{font:500 18px system-ui,sans-serif}</style>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M2 2l8 4-8 4z" class="accent"/></marker>
  </defs>
  <rect class="bg" width="1200" height="520"/>
  <text x="56" y="58" class="label ink">Route only what is needed</text>
  <text x="56" y="92" class="small muted">Keyword concepts, route hints, prompt metadata, and scenario links converge into a small execution graph.</text>
  <g transform="translate(56 145)"><rect class="panel" width="180" height="170" rx="8"/><text x="24" y="46" class="small accent">1</text><text x="24" y="84" class="label ink">Query</text><text x="24" y="122" class="tiny muted">tokens</text><text x="24" y="148" class="tiny muted">aliases</text></g>
  <path class="line" marker-end="url(#arrow)" d="M252 230h92"/>
  <g transform="translate(360 145)"><rect class="panel" width="200" height="170" rx="8"/><text x="24" y="46" class="small accent">2</text><text x="24" y="84" class="label ink">Score</text><text x="24" y="122" class="tiny muted">field weight</text><text x="24" y="148" class="tiny muted">rarity + hints</text></g>
  <path class="line" marker-end="url(#arrow)" d="M576 230h92"/>
  <g transform="translate(684 145)"><rect class="panel" width="220" height="170" rx="8"/><text x="24" y="46" class="small accent">3</text><text x="24" y="84" class="label ink">Graph</text><text x="24" y="122" class="tiny muted">prompt + scenario</text><text x="24" y="148" class="tiny muted">prerequisites</text></g>
  <path class="line" marker-end="url(#arrow)" d="M920 230h92"/>
  <g transform="translate(1028 145)"><rect class="panel" width="116" height="170" rx="8"/><text x="24" y="46" class="small accent">4</text><text x="24" y="84" class="label ink">Run</text><text x="24" y="122" class="tiny muted">verify</text></g>
  <g transform="translate(56 380)"><rect class="soft" width="1088" height="68" rx="8"/><rect class="accent" x="24" y="20" width="156" height="28" rx="4"/><rect class="warn" x="204" y="20" width="108" height="28" rx="4"/><rect class="accent" x="336" y="20" width="308" height="28" rx="4" opacity=".72"/><text x="676" y="42" class="small ink">Explainable confidence: concepts matched, field evidence, and residual unknowns.</text></g>
</svg>
