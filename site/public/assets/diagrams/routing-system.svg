<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" viewBox="0 0 1200 520">
  <title id="title">Mission Directives routing system</title>
  <desc id="desc">A left to right flow showing query analysis, deterministic scoring, selected prompt graph, execution, and verification evidence.</desc>
  <defs>
    <style>.bg{fill:#f8faf9}.panel{fill:#fff;stroke:#d4dcd8;stroke-width:2}.ink{fill:#0d1411}.muted{fill:#59645f}.accent{fill:#146f49}.warn{fill:#b84f37}.line{fill:none;stroke:#146f49;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}.soft{fill:#d7eee4}.small{font:500 20px system-ui,sans-serif}.label{font:720 28px system-ui,sans-serif}.tiny{font:500 17px system-ui,sans-serif}</style>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M2 2l8 4-8 4z" class="accent"/></marker>
  </defs>
  <rect class="bg" width="1200" height="520"/>
  <text x="56" y="58" class="label ink">Route only what is needed</text>
  <text x="56" y="92" class="small muted">Keyword concepts, route hints, metadata, and scenarios converge into one bounded execution graph.</text>
  <g transform="translate(56 145)"><rect class="panel" width="180" height="170" rx="4"/><text x="24" y="46" class="small accent">1</text><text x="24" y="84" class="label ink">Query</text><text x="24" y="122" class="tiny muted">tokens</text><text x="24" y="148" class="tiny muted">aliases</text></g>
  <path class="line" marker-end="url(#arrow)" d="M252 230h92"/>
  <g transform="translate(360 145)"><rect class="panel" width="200" height="170" rx="4"/><text x="24" y="46" class="small accent">2</text><text x="24" y="84" class="label ink">Score</text><text x="24" y="122" class="tiny muted">field weight</text><text x="24" y="148" class="tiny muted">rarity + hints</text></g>
  <path class="line" marker-end="url(#arrow)" d="M576 230h92"/>
  <g transform="translate(684 145)"><rect class="panel" width="220" height="170" rx="4"/><text x="24" y="46" class="small accent">3</text><text x="24" y="84" class="label ink">Graph</text><text x="24" y="122" class="tiny muted">prompt + scenario</text><text x="24" y="148" class="tiny muted">prerequisites</text></g>
  <path class="line" marker-end="url(#arrow)" d="M920 230h92"/>
  <g transform="translate(1028 145)"><rect class="panel" width="116" height="170" rx="4"/><text x="24" y="46" class="small accent">4</text><text x="24" y="84" class="label ink">Run</text><text x="24" y="122" class="tiny muted">verify</text></g>
  <g transform="translate(56 378)"><rect class="soft" width="1088" height="76" rx="4"/><rect class="accent" x="24" y="24" width="156" height="28" rx="3"/><rect class="warn" x="204" y="24" width="108" height="28" rx="3"/><rect class="accent" x="336" y="24" width="260" height="28" rx="3" opacity=".72"/><text x="628" y="34" class="tiny ink">Explainable confidence:</text><text x="628" y="58" class="tiny muted">matched concepts, field evidence, residual unknowns.</text></g>
</svg>